<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анкета посетителя — iRidi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="card-title mb-1 text-center">Анкета посетителя</h3>
    

                        <form id="surveyForm" novalidate>
                            <!-- 1. Имя -->
                            <div class="mb-3">
                                <label for="nameInput" class="form-label fw-bold">1. Имя <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="nameInput" name="name"
                                       placeholder="Введите имя" required>
                            </div>

                            <!-- 2. Компания -->
                            <div class="mb-3">
                                <label for="companyInput" class="form-label fw-bold">2. Компания</label>
                                <input type="text" class="form-control" id="companyInput" name="company"
                                       placeholder="Название компании">
                            </div>

                            <!-- 3. Кто вы? -->
                            <div class="mb-3">
                                <label for="roleSelect" class="form-label fw-bold">3. Кто вы?</label>
                                <select class="form-select" id="roleSelect" name="role">
                                    <option value="" selected disabled>— выберите вариант —</option>
                                    <option value="частное лицо, смотрю для себя">частное лицо, смотрю для себя</option>
                                    <option value="интегратор">интегратор</option>
                                    <option value="заказчик от юр. лица">заказчик от юр. лица</option>
                                    <option value="дизайнер, архитектор">дизайнер, архитектор</option>
                                    <option value="инженер по эксплуатации">инженер по эксплуатации</option>
                                    <option value="электрик, слаботочник">электрик, слаботочник</option>
                                    <option value="продавец УД, ЭУИ, инженерки">продавец УД, ЭУИ, инженерки</option>
                                    <option value="застройщик, девелопер">застройщик, девелопер</option>
                                    <option value="проектировщик">проектировщик</option>
                                    <option value="другое">другое</option>
                                </select>
                            </div>

                            <!-- 4. Что интересует на стенде iRidi -->
                            <div class="mb-3">
                                <label class="form-label fw-bold d-block">4. Что интересует на стенде iRidi</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="stand_interest"
                                           value="материалы о продуктах" id="stand1">
                                    <label class="form-check-label" for="stand1">материалы о продуктах</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="stand_interest"
                                           value="ищу вендора как инсталлятор" id="stand2">
                                    <label class="form-check-label" for="stand2">ищу вендора как инсталлятор</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="stand_interest"
                                           value="ищу себе инсталлятора" id="stand3">
                                    <label class="form-check-label" for="stand3">ищу себе инсталлятора</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="stand_interest"
                                           value="хочу стать дистрибьютором" id="stand4">
                                    <label class="form-check-label" for="stand4">хочу стать дистрибьютором</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="stand_interest"
                                           value="обучающие курсы" id="stand5">
                                    <label class="form-check-label" for="stand5">обучающие курсы</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="stand_interest"
                                           value="договориться о презентации pre-sale менеджера" id="stand6">
                                    <label class="form-check-label" for="stand6">договориться о презентации pre-sale менеджера</label>
                                </div>
                            </div>

                            <!-- 5. Интересующие направления -->
                            <div class="mb-3">
                                <label class="form-label fw-bold d-block">5. Интересующие направления</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="directions"
                                           value="SmartHome" id="dir1">
                                    <label class="form-check-label" for="dir1">SmartHome</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="directions"
                                           value="Коммерция, АУ" id="dir2">
                                    <label class="form-check-label" for="dir2">Коммерция, АУ</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="directions"
                                           value="МКД" id="dir3">
                                    <label class="form-check-label" for="dir3">МКД</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="directions"
                                           value="Отели" id="dir4">
                                    <label class="form-check-label" for="dir4">Отели</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="directions"
                                           value="BMS" id="dir5">
                                    <label class="form-check-label" for="dir5">BMS</label>
                                </div>
                            </div>

                            <!-- 6. Что интересует -->
                            <div class="mb-3">
                                <label class="form-label fw-bold d-block">6. Что интересует</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="interest"
                                           value="Нужно КП, презентация, встреча или партнерство" id="int1">
                                    <label class="form-check-label" for="int1">Нужно КП, презентация, встреча или партнерство</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="interest"
                                           value="Будущие планы" id="int2">
                                    <label class="form-check-label" for="int2">Будущие планы</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="interest"
                                           value="Смотрю, что есть на рынке" id="int3">
                                    <label class="form-check-label" for="int3">Смотрю, что есть на рынке</label>
                                </div>
                            </div>

                            <!-- 7. Телефон -->
                            <div class="mb-3">
                                <label for="phoneInput" class="form-label fw-bold">7. Телефон <span class="text-danger">*</span></label>
                                <input type="tel" class="form-control" id="phoneInput" name="phone"
                                       placeholder="+7 (___) ___-__-__" required>
                            </div>

                            <!-- 8. Email -->
                            <div class="mb-3">
                                <label for="emailInput" class="form-label fw-bold">8. Email <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" id="emailInput" name="email"
                                       placeholder="you@example.com" required>
                            </div>

                            <!-- 9. Комментарий -->
                            <div class="mb-4">
                                <label for="followupInput" class="form-label fw-bold">9. Выслать/сделать после выставки</label>
                                <textarea class="form-control" id="followupInput" name="followup" rows="3"
                                          placeholder="Комментарий (необязательно)"></textarea>
                            </div>

                            <button type="submit" class="btn btn-success w-100 btn-lg" id="submitBtn">
                                Отправить анкету
                            </button>
                        </form>

                        <div id="messageContainer" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/api/userApi.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
